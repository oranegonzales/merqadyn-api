spring.application.name=Merqadyn API
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/merqadyn}
spring.datasource.username=${DATABASE_USER:merqadyn}
spring.datasource.password=${DATABASE_PASSWORD:merqadyn}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Merqadyn API
info.app.version=1.0.0
merqadyn.security.username=${MERQADYN_ADMIN_USER:merqadyn}
merqadyn.security.password=${MERQADYN_ADMIN_PASSWORD:change-me}
merqadyn.demo-merchant-id=${MERQADYN_DEMO_MERCHANT_ID:11111111-1111-4111-8111-111111111111}
