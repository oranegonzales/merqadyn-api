spring.application.name=Merqadyn API
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/merqadyn}
spring.datasource.username=${DATABASE_USER:merqadyn}
spring.datasource.password=${DATABASE_PASSWORD:merqadyn}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false
info.app.name=Merqadyn API
info.app.version=1.0.0
merqadyn.security.username=${MERQADYN_ADMIN_USER}
merqadyn.security.password=${MERQADYN_ADMIN_PASSWORD}
merqadyn.security.max-request-bytes=524288
merqadyn.security.write-limit-per-minute=120
merqadyn.security.enrollment-limit-per-minute=10
merqadyn.security.rate-limit-backend=${RATE_LIMIT_BACKEND:redis}
merqadyn.demo-merchant-id=${MERQADYN_DEMO_MERCHANT_ID:11111111-1111-4111-8111-111111111111}
