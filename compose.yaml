services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merqadyn
      POSTGRES_USER: ${DATABASE_USER:-merqadyn}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-merqadyn}
    volumes:
      - merqadyn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  app:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/merqadyn
      DATABASE_USER: ${DATABASE_USER:-merqadyn}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-merqadyn}
      MERQADYN_ADMIN_USER: ${MERQADYN_ADMIN_USER:-merqadyn}
      MERQADYN_ADMIN_PASSWORD: ${MERQADYN_ADMIN_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  merqadyn-postgres:
