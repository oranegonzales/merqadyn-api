name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_USER: merqadyn_ci
      DATABASE_PASSWORD: ci-database-password-not-used-outside-actions
      MERQADYN_ADMIN_USER: merqadyn-ci
      MERQADYN_ADMIN_PASSWORD: ci-admin-password-not-used-outside-actions
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Windows launcher
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/start-local.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify application
        run: ./gradlew --no-daemon clean test bootJar --no-build-cache

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Verify PostgreSQL startup
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check application health
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health

      - name: Stop test services
        if: always()
        run: docker compose down --volumes
